
<style>

</style>

    detail: 'Phase I is where long-term thinking happens, by structural mandate. The practitioner who skips this becomes permanently reactive — always operating in the present tense, responding to what is in front of him, never building the architecture of what he intends to construct over decades. The long horizon is not a luxury. It is the navigation system.'

  {

    tags: [],

  {

  {

  {

  {

  {

  },
  {

    tags: [],

  {

  {

  {

  {

  {

  {

  {

  },
  {
    phase: 'R2', time: '22:07',
    title: 'Closing Ritual — The Drink & The Smoke',
    sub: 'Sit. The drink is now reckoning: the physical act of acknowledging everything the day was — not what you wanted it to be, not what it might have been — but what it actually was. The smoke is dissolution: releasing the day itself, its achievements, its failures, its open threads. Back into time.',
    tags: ['ritual'],
    detail: 'The day is over. It contributed to what comes next, or it did not. In either case, it is no longer yours to carry. The closing ritual is the physical embodiment of the Law of Closure — not completion, but the refusal to let the unfinished consume the essential. When the smoke dissipates, you do not chase it.',
    quote: 'The work is always unfinished. The day is always closed anyway. These two facts are not in conflict.'
  },
];

function renderSchedule(filterPhaseId) {
  const body = document.getElementById('schedule-body');
  body.innerHTML = '';

  const phaseMap = {
    'R': 'R', 'I': 'I', 'II': 'II', 'III': 'III', 'IV': 'IV', 'R2': 'R'
  };

  let renderedPhases = new Set();

  const phaseOrder = ['R', 'I', 'II', 'III', 'IV', 'R2'];
  const phaseConfig = {
    'R':  { label: 'Opening Ritual', timeRange: '03:14', color: 'phase-R' },
    'I':  { label: 'Phase I — Isolation & Awakening', timeRange: '03:14 – 06:00', color: 'phase-I' },
    'II': { label: 'Phase II — Construction & Execution', timeRange: '06:00 – 12:00', color: 'phase-II' },
    'III':{ label: 'Phase III — Friction & Endurance', timeRange: '12:00 – 17:00', color: 'phase-III' },
    'IV': { label: 'Phase IV — Reflection & Closure', timeRange: '17:00 – 22:07', color: 'phase-IV' },
    'R2': { label: 'Closing Ritual', timeRange: '22:07', color: 'phase-R' },
  };

  let visibleCount = 0;

  phaseOrder.forEach(pid => {
    const entries = ENTRIES.filter(e => e.phase === pid);
    const matchesFilter = filterPhaseId === 'all' ||
      filterPhaseId === phaseMap[pid] ||
      (filterPhaseId === 'R' && (pid === 'R' || pid === 'R2'));

    if (!matchesFilter) return;

    const cfg = phaseConfig[pid];

    const ph = document.createElement('div');
    ph.style.cssText = 'display:flex;align-items:baseline;gap:12px;margin:1.75rem 0 0.6rem;';
    ph.innerHTML = `
      <span class="phase-label ${cfg.color}" style="font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:4px;flex-shrink:0">${cfg.label}</span>
      <span style="font-size:12px;color:var(--color-text-tertiary);margin-left:auto;flex-shrink:0">${cfg.timeRange}</span>
    `;
    body.appendChild(ph);

    entries.forEach((entry, idx) => {
      visibleCount++;
      const el = document.createElement('div');
      el.className = 'entry' + (entry.tags && entry.tags.includes('ritual') ? ' ritual' : '');
      el.dataset.idx = `${pid}-${idx}`;

      let tagHTML = '';
      if (entry.tags) {
        entry.tags.forEach(t => {
          if (t === 'ritual') tagHTML += `<span class="ritual-tag">Ritual</span>`;
          else tagHTML += `<span class="law-tag">${t.replace('law:', 'Law of ').replace('-', ' ')}</span>`;
        });
      }

      el.innerHTML = `
        <div class="entry-time">${entry.time}</div>
        <div class="entry-main">
          <div class="entry-title">${entry.title}${tagHTML}</div>
          <div class="entry-sub">${entry.sub}</div>
        </div>
      `;
      el.onclick = () => toggleDetail(el, entry);
      body.appendChild(el);
    });
  });
}

function toggleDetail(el, entry) {
  const existing = el.nextElementSibling;
  if (existing && existing.classList.contains('detail-panel')) {
    existing.classList.toggle('open');
    return;
  }
  const panel = document.createElement('div');
  panel.className = 'detail-panel open';
  panel.innerHTML = `<p>${entry.detail}</p>${entry.quote ? `<blockquote>"${entry.quote}"</blockquote>` : ''}`;
  el.insertAdjacentElement('afterend', panel);
}

function filterPhase(phaseId, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderSchedule(phaseId);
}

renderSchedule('all');
</script>
